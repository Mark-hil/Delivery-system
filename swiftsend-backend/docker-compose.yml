services:
  postgres:
    image: postgres:16-alpine
    container_name: swiftsend_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swiftsend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swiftsend_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-swiftsend_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: swiftsend_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
